apiVersion: 1

providers:

  - name: Xeno
    orgId: 1
    # Empty folder => dashboards land in the top-level Dashboards list so they are
    # immediately visible without opening a folder.
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
