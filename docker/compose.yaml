services:
  xeno-postgres:
    image: postgres:16-alpine
    container_name: xeno-postgres
    environment:
      POSTGRES_DB: xeno
      POSTGRES_USER: xeno
      POSTGRES_PASSWORD: xeno
    ports:
      - "5432:5432"
    volumes:
      - xeno-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xeno -d xeno"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-server:
    image: jchristn77/xeno-server:v0.1.0
    build:
      context: ..
      dockerfile: src/Xeno.Server/Dockerfile
    container_name: xeno-server
    ports:
      - "9000:9000"
    volumes:
      - ./xeno.json:/app/xeno.json:ro
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      xeno-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-dashboard:
    image: jchristn77/xeno-dashboard:v0.1.0
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: xeno-dashboard
    ports:
      - "9100:9100"
    environment:
      XENO_SERVER_URL: http://localhost:9000
    depends_on:
      xeno-server:
        condition: service_healthy

volumes:
  xeno-postgres-data:
