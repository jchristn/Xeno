services:
  xeno-postgres:
    image: postgres:16-alpine
    container_name: xeno-postgres
    environment:
      POSTGRES_DB: xeno
      POSTGRES_USER: xeno
      POSTGRES_PASSWORD: xeno
    ports:
      - "5432:5432"
    volumes:
      - xeno-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xeno -d xeno"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-mysql:
    image: mysql:9
    container_name: xeno-mysql
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: xeno
      MYSQL_USER: xeno
      MYSQL_PASSWORD: xeno
      MYSQL_ROOT_PASSWORD: xeno-root
    ports:
      - "3306:3306"
    volumes:
      - xeno-mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uxeno", "-pxeno"]
      interval: 5s
      timeout: 3s
      retries: 20

  xeno-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: xeno-sqlserver
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Xeno_password_123"
    ports:
      - "1433:1433"
    volumes:
      - xeno-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Xeno_password_123 -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  xeno-server:
    image: jchristn77/xeno-server:v0.1.0
    build:
      context: ..
      dockerfile: src/Xeno.Server/Dockerfile
    container_name: xeno-server
    ports:
      - "9000:9000"
    volumes:
      - ./xeno.json:/app/xeno.json:ro
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      xeno-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-dashboard:
    image: jchristn77/xeno-dashboard:v0.1.0
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: xeno-dashboard
    ports:
      - "9100:9100"
    environment:
      XENO_SERVER_URL: http://localhost:9000
    depends_on:
      xeno-server:
        condition: service_healthy

volumes:
  xeno-postgres-data:
  xeno-mysql-data:
  xeno-sqlserver-data:
