name: xeno

services:
  xeno-postgres:
    image: postgres:16-alpine
    container_name: xeno-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - xeno-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-postgres-init:
    image: postgres:16-alpine
    container_name: xeno-postgres-init
    depends_on:
      xeno-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/init.sql:ro
    command: >
      sh -c "psql -h xeno-postgres -U postgres -d postgres -v ON_ERROR_STOP=1 -f /init.sql
      && PGPASSWORD=xeno psql -h xeno-postgres -U xeno -d xeno -v ON_ERROR_STOP=1 -c 'SELECT 1;'"
    restart: "no"

  xeno-server:
    image: jchristn77/xeno-server:v0.1.0
    build:
      context: ..
      dockerfile: src/Xeno.Server/Dockerfile
    container_name: xeno-server
    ports:
      - "9000:9000"
    volumes:
      - ./xeno.json:/app/xeno.json:ro
      - ./logs:/app/logs
    depends_on:
      xeno-postgres:
        condition: service_healthy
      xeno-postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-dashboard:
    image: jchristn77/xeno-dashboard:v0.1.0
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: xeno-dashboard
    ports:
      - "9100:9100"
    environment:
      XENO_SERVER_URL: http://localhost:9000
    depends_on:
      xeno-server:
        condition: service_healthy

volumes:
  xeno-postgres-data:
