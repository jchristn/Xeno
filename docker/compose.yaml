name: xeno

services:
  xeno-postgres:
    image: postgres:16-alpine
    container_name: xeno-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - xeno-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-postgres-init:
    image: postgres:16-alpine
    container_name: xeno-postgres-init
    depends_on:
      xeno-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/init.sql:ro
    command: >
      sh -c "psql -h xeno-postgres -U postgres -d postgres -v ON_ERROR_STOP=1 -f /init.sql
      && PGPASSWORD=xeno psql -h xeno-postgres -U xeno -d xeno -v ON_ERROR_STOP=1 -c 'SELECT 1;'
      && PGPASSWORD=netledger psql -h xeno-postgres -U netledger -d netledger -v ON_ERROR_STOP=1 -c 'SELECT 1;'"
    restart: "no"

  netledger-server:
    image: ${NETLEDGER_SERVER_IMAGE:-jchristn77/netledger:v3.0.0}
    container_name: netledger-server
    ports:
      - "${NETLEDGER_SERVER_PORT:-8080}:8080"
    volumes:
      - ./netledger:/app/data
    command: ["-f", "/app/data/netledger.json"]
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
    depends_on:
      xeno-postgres:
        condition: service_healthy
      xeno-postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  netledger-ui:
    image: ${NETLEDGER_UI_IMAGE:-jchristn77/netledger-ui:v3.0.0}
    container_name: netledger-ui
    ports:
      - "${NETLEDGER_UI_PORT:-9200}:80"
    environment:
      NETLEDGER_SERVER_URL: http://localhost:${NETLEDGER_SERVER_PORT:-8080}
    depends_on:
      netledger-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  xeno-server:
    image: jchristn77/xeno-server:v0.1.0
    build:
      context: ..
      dockerfile: src/Xeno.Server/Dockerfile
    container_name: xeno-server
    ports:
      - "9000:9000"
    volumes:
      - ./xeno.json:/app/xeno.json:ro
      - ./logs:/app/logs
    environment:
      - XENO_LEDGER_API_KEY=${NETLEDGER_ACCESS_KEY:-default}
      - XENO_LEDGER_SECRET_KEY=${NETLEDGER_SECRET_KEY:-default}
    depends_on:
      xeno-postgres:
        condition: service_healthy
      xeno-postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-dashboard:
    image: jchristn77/xeno-dashboard:v0.1.0
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: xeno-dashboard
    ports:
      - "9100:9100"
    environment:
      XENO_SERVER_URL: http://localhost:9000
    depends_on:
      xeno-server:
        condition: service_healthy

volumes:
  xeno-postgres-data:
