name: xeno

services:
  xeno-postgres:
    image: postgres:16-alpine
    container_name: xeno-postgres
    ports:
      - "${XENO_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - xeno-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-postgres-init:
    image: postgres:16-alpine
    container_name: xeno-postgres-init
    depends_on:
      xeno-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/init.sql:ro
    command: >
      sh -c "psql -h xeno-postgres -U postgres -d postgres -v ON_ERROR_STOP=1 -f /init.sql
      && PGPASSWORD=xeno psql -h xeno-postgres -U xeno -d xeno -v ON_ERROR_STOP=1 -c 'SELECT 1;'
      && PGPASSWORD=netledger psql -h xeno-postgres -U netledger -d netledger -v ON_ERROR_STOP=1 -c 'SELECT 1;'
      && PGPASSWORD=less3 psql -h xeno-postgres -U less3 -d less3 -v ON_ERROR_STOP=1 -c 'SELECT 1;'"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Less3 — S3-compatible object store used as the NetLedger archive backend.
  # Multi-tenant (v3). Uses its own "less3" role/database on xeno-postgres for
  # control-plane metadata; object payloads stay on the local ./less3/disk
  # volume. On first boot against the empty database, Less3 creates its schema
  # and seeds tenant/user/bucket/credential "default" (admin@less3 / password,
  # S3 key default/default) because DOTNET_RUNNING_IN_CONTAINER=true.
  # ---------------------------------------------------------------------------
  less3:
    image: ${LESS3_IMAGE:-jchristn77/less3:v3.0.0}
    container_name: xeno-less3
    restart: unless-stopped
    ports:
      - "${LESS3_PORT:-8000}:8000"
    stdin_open: true
    tty: true
    volumes:
      - ./less3/system.json:/app/system.json
      - ./less3/logs:/app/logs
      - ./less3/temp:/app/temp
      - ./less3/disk:/app/disk
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - LESS3_PORT=8000
    depends_on:
      xeno-postgres:
        condition: service_healthy
      xeno-postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '' http://localhost:8000 ; test $$? -ne 7"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  less3-ui:
    image: ${LESS3_UI_IMAGE:-jchristn77/less3-ui:v3.0.0}
    container_name: xeno-less3-ui
    restart: unless-stopped
    environment:
      TERM: xterm-256color
      LESS3_SERVER_URL: https://less3.xenocloud.ai:${LESS3_PORT:-8000}
      NEXT_PUBLIC_LESS3_SERVER_URL: https://less3.xenocloud.ai:${LESS3_PORT:-8000}
    ports:
      - "${LESS3_UI_PORT:-9300}:3000"
    depends_on:
      less3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '' http://localhost:3000 ; test $$? -ne 7"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # NetLedger Server — active ledger. Xeno drains ledger entries here.
  # Archive integration is pre-wired to the archive server + Less3 pool.
  # ---------------------------------------------------------------------------
  netledger-server:
    image: ${NETLEDGER_SERVER_IMAGE:-jchristn77/netledger:v4.0.0}
    container_name: netledger-server
    ports:
      - "${NETLEDGER_SERVER_PORT:-8080}:8080"
    volumes:
      - ./netledger:/app/data
    command: ["-f", "/app/data/netledger.json"]
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
    depends_on:
      xeno-postgres:
        condition: service_healthy
      xeno-postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # NetLedger Archive Server — cold ledger. Serves archived entries and writes
  # archived payloads into the Less3 storage pool. Auth is delegated to the
  # active NetLedger Server via introspection.
  # ---------------------------------------------------------------------------
  netledger-archive-server:
    image: ${NETLEDGER_ARCHIVE_IMAGE:-jchristn77/netledger-archive:v4.0.0}
    container_name: netledger-archive-server
    ports:
      - "${NETLEDGER_ARCHIVE_PORT:-8081}:8081"
    volumes:
      - ./netledger-archive:/app/data
    command: ["-f", "/app/data/netledger.json"]
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - NETLEDGER_ARCHIVE_STORAGE_TYPE=S3
      - NETLEDGER_ARCHIVE_STORAGE_BUCKET=default
      - NETLEDGER_ARCHIVE_STORAGE_PREFIX=netledger-archive
      - NETLEDGER_ARCHIVE_STORAGE_REGION=us-west-1
      - NETLEDGER_ARCHIVE_STORAGE_ENDPOINT=http://less3:8000
      - NETLEDGER_ARCHIVE_STORAGE_ACCESS_KEY=default
      - NETLEDGER_ARCHIVE_STORAGE_SECRET_KEY=default
    depends_on:
      netledger-server:
        condition: service_healthy
      less3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  netledger-ui:
    image: ${NETLEDGER_UI_IMAGE:-jchristn77/netledger-ui:v4.0.0}
    container_name: netledger-ui
    ports:
      - "${NETLEDGER_UI_PORT:-9200}:80"
    environment:
      NETLEDGER_SERVER_URL: https://netledger.xenocloud.ai:${NETLEDGER_SERVER_PORT:-8080}
      NETLEDGER_ARCHIVE_SERVER_URL: https://netledger.xenocloud.ai:${NETLEDGER_ARCHIVE_PORT:-8081}
    depends_on:
      netledger-server:
        condition: service_healthy
      netledger-archive-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Observability stack — OpenTelemetry Collector, Prometheus, Tempo, Loki, and
  # Grafana. xeno-server emits OTLP (metrics + traces) to the Collector and writes
  # rolling logs to the shared ./logs volume, which the Collector's filelog
  # receiver ships to Loki. Grafana is provisioned with datasources and pre-built
  # dashboards and runs anonymous-Admin for turnkey local use on host port 9400.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: xeno-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./logs/:/app/logs:ro
    ports:
      - "${XENO_OTLP_GRPC_PORT:-4317}:4317"
      - "${XENO_OTLP_HTTP_PORT:-4318}:4318"
      - "${XENO_OTEL_PROM_PORT:-8889}:8889"
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: xeno-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./telemetry/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "${XENO_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: xeno-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo.yaml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: xeno-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./telemetry/loki-config.yaml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: xeno-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${XENO_GRAFANA_PORT:-9400}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  xeno-server:
    image: ${XENO_SERVER_IMAGE:-jchristn77/xeno-server:v0.2.0}
    container_name: xeno-server
    ports:
      - "9000:9000"
    volumes:
      - ./xeno.json:/app/xeno.json
      - ./logs:/app/logs
    environment:
      - XENO_LEDGER_API_KEY=${NETLEDGER_ACCESS_KEY:-default}
      - XENO_LEDGER_SECRET_KEY=${NETLEDGER_SECRET_KEY:-default}
      - XENO_TELEMETRY_OTLP_ENDPOINT=http://otel-collector:4317
      - XENO_TELEMETRY_OTLP_PROTOCOL=grpc
    depends_on:
      xeno-postgres:
        condition: service_healthy
      xeno-postgres-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  xeno-dashboard:
    image: ${XENO_DASHBOARD_IMAGE:-jchristn77/xeno-dashboard:v0.2.0}
    container_name: xeno-dashboard
    ports:
      - "9100:9100"
    environment:
      XENO_SERVER_URL: http://localhost:9000
    depends_on:
      xeno-server:
        condition: service_healthy

volumes:
  xeno-postgres-data:
