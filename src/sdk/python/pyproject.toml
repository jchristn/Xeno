[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xeno-client"
version = "0.1.0"
description = "Python SDK for the Xeno AI control plane."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joel Christner" }]

[project.scripts]
xeno-sdk-console = "xeno_client.console:main"

[tool.setuptools.packages.find]
where = ["src"]
